<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: hwb(0 0% 100%);
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: hwb(0 100% 0%);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 10px hsla(0, 94%, 27%, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 16px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid red;
            border-radius: 5px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 6px;
        }

        input:invalid {
            border-color: red;
        }

        input:valid {
            border-color: green;
        }

        .error {
            color: red;
            font-size: 16px;
            margin: 6px 0 20px 0;
        }

        .btn {
            display: block;
            margin-left: auto;
            padding: 12PX 30px;
            font-size: 16px;
            background: rgb(250, 2, 2);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .btn:hover {
            background: #1e00ff;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Student Registration</h1>

    <form>

        <label>Full Name:</label>
        <input type="text"
               required
               pattern="[A-Za-z ]{10,30}"
               title="Must contain 10 to 30 letters only">
        <div class="error">Must contain 10–30 letters</div>

        <label>Email:</label>
        <input type="email"
               required>
        <div class="error">Valid email only</div>

        <label>Age:</label>
        <input type="number"
               required
               min="18"
               max="30">
        <div class="error">Age 18–30</div>

        <button type="submit" class="btn">Register</button>

    </form>
</div>
</body>
</html>
